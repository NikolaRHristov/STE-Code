# Agent Backends Configuration
# Add new agents here. The default_agent is used when no --agent flag is given.
#
# Each agent needs:
#   For Hermes:  runtime (venv python path) + wrapper (oneshot script)
#   For CLI agents: command + args + prompt_arg
#
# See agent-runner.py for full documentation.

default_agent: hermes

agents:
  hermes:
    runtime: ~/.hermes/hermes-agent/venv/bin/python3
    wrapper: lib/hermes-oneshot-wrapper.py
    default_model: tencent/hy3:free
    env:
      HERMES_REASONING_EFFORT: high
      HERMES_YOLO_MODE: "1"
      HERMES_ACCEPT_HOOKS: "1"

